<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分店週報儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #3c2929;
      display: flex; align-items: center; justify-content: center;
    }
    #login-screen.hidden { display: none; }
    .login-box {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: 360px; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .login-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .login-logo svg rect:first-child { fill: #3c2929; }
    .login-logo span { font-size: 18px; font-weight: 600; color: #3c2929; font-family: 'Noto Sans TC', sans-serif; }
    .login-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .login-field input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e5e7eb;
      border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: #3c2929; }
    .login-btn {
      width: 100%; padding: 11px; background: #3c2929; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      margin-top: 12px; font-size: 13px; color: #dc2626;
      text-align: center; min-height: 20px;
    }
    #app { display: none; }
    #app.visible { display: flex; }
  </style>
</head>
<body>

  <!-- 登入畫面 -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#3c2929"/>
          <rect x="6" y="10" width="16" height="2.5" rx="1.25" fill="white"/>
          <rect x="6" y="15.5" width="10" height="2.5" rx="1.25" fill="white"/>
        </svg>
        <span>週報系統</span>
      </div>
      <div class="login-title">歡迎回來</div>
      <div class="login-sub">請輸入帳號密碼登入</div>
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" />
      </div>
      <div class="login-field">
        <label>密碼</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">登入</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- 主應用 -->
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="rgba(255,255,255,0.2)"/><rect x="6" y="10" width="16" height="2.5" rx="1.25" fill="white"/><rect x="6" y="15.5" width="10" height="2.5" rx="1.25" fill="white"/></svg>
        <span class="logo-text">週報系統</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="dashboard">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          總覽
        </button>
        <button class="nav-item" data-section="stores">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6l6-4 6 4v8H2V6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 14V9h4v5" stroke="currentColor" stroke-width="1.5"/></svg>
          分店比較
        </button>
        <button class="nav-item" data-section="logs">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          主管日誌
        </button>
        <button class="nav-item" data-section="yoy">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 12L5 7l3 3 3-4 3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          年度比較
        </button>
        <button class="nav-item" data-section="wd">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M1 6h14M5 2v4M11 2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          平假日分析
        </button>
        <a href="/hr.html" target="_blank" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M1 13c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M11 7l1.5 1.5L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          人事成本
        </a>
        <button class="nav-item" data-section="settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          設定
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="connection-status" id="connStatus">
          <span class="dot dot-gray"></span>
          <span>尚未連線</span>
        </div>
        <button onclick="doLogout()" style="margin-top:8px;width:100%;padding:7px;background:rgba(255,255,255,0.12);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">登出</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="pageTitle">總覽</h1>
          <span class="date-range-label" id="dateRangeLabel"></span>
        </div>
        <div class="topbar-right" id="mainTopbarRight">
          <div class="filter-btns">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="direct">直營</button>
            <button class="filter-btn" data-filter="franchise">加盟</button>
          </div>
          <div class="quick-btns">
            <button class="quick-btn active" data-range="thisweek">本週</button>
            <button class="quick-btn" data-range="lastweek">上週</button>
            <button class="quick-btn" data-range="thismonth">本月</button>
            <button class="quick-btn" data-range="lastmonth">上個月</button>
            <button class="quick-btn" data-range="custom">自訂</button>
          </div>
          <div class="date-inputs" id="dateInputs" style="display:none;">
            <input type="date" id="dateFrom" />
            <span class="date-sep">—</span>
            <input type="date" id="dateTo" />
          </div>
          <button class="btn-fetch" id="fetchBtn">載入報表</button>
        </div>
        <div class="topbar-right" id="yoyTopbarRight" style="display:none;">
          <div class="filter-btns">
            <button class="filter-btn active" data-yoy-filter="all">全部</button>
            <button class="filter-btn" data-yoy-filter="direct">直營</button>
            <button class="filter-btn" data-yoy-filter="franchise">加盟</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="font-size:12px;color:#6b7280;">比較月份</label>
            <select id="yoyYear" class="settings-input" style="width:90px;padding:5px 8px;font-size:12px;"></select>
            <select id="yoyMonth" class="settings-input" style="width:80px;padding:5px 8px;font-size:12px;">
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
              <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
              <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
              <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
          </div>
          <button class="btn-fetch" id="yoyFetchBtn">載入比較</button>
        </div>
        <div class="topbar-right" id="wdTopbarRight" style="display:none;">
          <div class="filter-btns">
            <button class="filter-btn active" data-wd-filter="all">全部</button>
            <button class="filter-btn" data-wd-filter="direct">直營</button>
            <button class="filter-btn" data-wd-filter="franchise">加盟</button>
          </div>
          <div class="filter-btns" style="border-left:1px solid #E8EDEB;margin-left:4px;padding-left:8px;">
            <button class="filter-btn active" data-wd-session="all">全部時段</button>
            <button class="filter-btn" data-wd-session="noon">中午</button>
            <button class="filter-btn" data-wd-session="evening">晚上</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="font-size:12px;color:#6b7280;">分析月份</label>
            <select id="wdYear" class="settings-input" style="width:90px;padding:5px 8px;font-size:12px;"></select>
            <select id="wdMonth" class="settings-input" style="width:80px;padding:5px 8px;font-size:12px;">
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
              <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
              <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
              <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
          </div>
          <button class="btn-fetch" id="wdFetchBtn">載入分析</button>
        </div>
      </header>

      <div class="content" id="content">
        <section class="section active" id="section-dashboard">
          <div id="dashboardContent">
            <div class="empty-state">
              <p class="empty-title">尚無資料</p>
              <p class="empty-sub">選擇日期區間後點擊「載入報表」</p>
            </div>
          </div>
        </section>
        <section class="section" id="section-stores">
          <div id="storesContent"><div class="empty-state"><p class="empty-title">請先載入報表</p></div></div>
        </section>
        <section class="section" id="section-logs">
          <div id="logsContent"><div class="empty-state"><p class="empty-title">請先載入報表</p></div></div>
        </section>
        <section class="section" id="section-yoy">
          <div id="yoyContent"><div class="empty-state"><p class="empty-title">選擇月份後點擊「載入比較」</p></div></div>
        </section>
        <section class="section" id="section-wd">
          <div id="wdContent"><div class="empty-state"><p class="empty-title">選擇月份後點擊「載入分析」</p></div></div>
        </section>
        <section class="section" id="section-settings">
          <div class="settings-card">
            <h2 class="settings-title">API 設定</h2>
            <p class="settings-desc">設定 Ragic 連線資訊，資料只儲存在你的瀏覽器中。</p>
            <div class="form-group">
              <label>Ragic API Token</label>
              <input type="password" id="settingsToken" class="settings-input mono" placeholder="貼上 Base64 API Token..." />
              <button class="btn-show-token" id="toggleTokenBtn" onclick="toggleToken()">顯示</button>
            </div>
            <div class="form-group">
              <label>Ragic 表單路徑</label>
              <input type="text" id="settingsPath" class="settings-input" placeholder="yourcompany/formname/1" />
              <p class="field-hint">例：yohannam/ragicsales-order-management/11</p>
            </div>
            <div class="form-group">
              <label>Ragic API 伺服器</label>
              <select id="settingsServer" class="settings-input">
                <option value="ap7">ap7.ragic.com（預設）</option>
                <option value="ap12">ap12.ragic.com</option>
                <option value="www">www.ragic.com</option>
              </select>
            </div>
            <div class="settings-actions">
              <button class="btn-save" onclick="saveSettings()">儲存設定</button>
              <span class="save-feedback" id="saveFeedback"></span>
            </div>
          </div>
          <div class="settings-card">
            <h2 class="settings-title">欄位對應</h2>
            <p class="settings-desc">設定 Ragic 表單欄位名稱（依照你的表單調整）</p>
            <div class="fields-grid">
              <div class="form-group"><label>營業日期</label><input type="text" id="fDate" class="settings-input" placeholder="營業日期" /></div>
              <div class="form-group"><label>分店名稱</label><input type="text" id="fStore" class="settings-input" placeholder="分店簡稱" /></div>
              <div class="form-group"><label>當日營業額</label><input type="text" id="fRev" class="settings-input" placeholder="當日營業額" /></div>
              <div class="form-group"><label>用餐人數</label><input type="text" id="fGuests" class="settings-input" placeholder="用餐人數" /></div>
              <div class="form-group"><label>用餐組數</label><input type="text" id="fGroups" class="settings-input" placeholder="用餐組數" /></div>
              <div class="form-group"><label>No Show 組數</label><input type="text" id="fNoshow" class="settings-input" placeholder="No Show組數" /></div>
              <div class="form-group"><label>客單價</label><input type="text" id="fAvgPay" class="settings-input" placeholder="客單價" /></div>
              <div class="form-group"><label>值班人員</label><input type="text" id="fSupervisor" class="settings-input" placeholder="值班人員" /></div>
              <div class="form-group"><label>客訴</label><input type="text" id="fComplaint" class="settings-input" placeholder="當日客訴與事件處理" /></div>
              <div class="form-group"><label>其他事件</label><input type="text" id="fShare" class="settings-input" placeholder="當日其他事件分享" /></div>
            </div>
            <div class="settings-actions">
              <button class="btn-save" onclick="saveFields()">儲存欄位設定</button>
              <span class="save-feedback" id="fieldsFeedback"></span>
            </div>
          </div>
        </section>
      </div>
      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script>
    // ── Supabase 初始化 ──
    const SUPABASE_URL = 'https://pboqxswqhpubfmehukqy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib3F4c3dxaHB1YmZtZWh1a3F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMDU0MjMsImV4cCI6MjA5Mzc4MTQyM30.ZMONQRqZOyju55S6Asd-qYpc4MK5Ga7_agwlCzbgbWw';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── 檢查登入狀態 ──
    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        showApp();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
      }
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
    }

    // ── 登入 ──
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');

      if (!email || !password) {
        errEl.textContent = '請輸入 Email 和密碼';
        return;
      }

      btn.disabled = true;
      btn.textContent = '登入中...';
      errEl.textContent = '';

      const { error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = '帳號或密碼錯誤，請再試一次';
        btn.disabled = false;
        btn.textContent = '登入';
      } else {
        showApp();
      }
    }

    // ── 登出 ──
    async function doLogout() {
      await _supabase.auth.signOut();
      document.getElementById('app').classList.remove('visible');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }

    // ── Enter 鍵登入 ──
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // ── 頁面載入時檢查 ──
    checkAuth();
  </script>

  <script src="app.js"></script>
</body>
</html>
